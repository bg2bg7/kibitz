services:
  postgres:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    container_name: kibitz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kibitz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kibitz_suite}
      INITIAL_ADMIN_HANDLE: ${INITIAL_ADMIN_HANDLE:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kibitz_pgdata:/var/lib/postgresql/data
      - ./packages/db/drizzle:/migrations:ro
      - ./docker/postgres/init-db-and-admin.sh:/docker-entrypoint-initdb.d/01-init-db-and-admin.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kibitz} -d ${POSTGRES_DB:-kibitz_suite}"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    image: rustfs/rustfs@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    container_name: kibitz-s3
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    ports:
      - "${S3_BIND_HOST:-127.0.0.1}:${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_BIND_HOST:-127.0.0.1}:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - kibitz_s3data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3-init:
    image: rustfs/rustfs@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    container_name: kibitz-s3-init
    depends_on:
      s3:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-kibitz-pgna}
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - |
        export RC_HOST_local="http://$${S3_ACCESS_KEY_ID}:$${S3_SECRET_ACCESS_KEY}@s3:9000"
        /usr/bin/rc bucket create "local/$${S3_BUCKET}" --ignore-existing

volumes:
  kibitz_pgdata:
  kibitz_s3data:
