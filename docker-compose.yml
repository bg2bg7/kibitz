services:
  postgres:
    image: postgres:16-alpine
    container_name: kibitz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kibitz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kibitz_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-kibitz_suite}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kibitz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kibitz} -d ${POSTGRES_DB:-kibitz_suite}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: kibitz-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-kibitz_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-kibitz_minio_dev_secret}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - kibitz_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: kibitz-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-kibitz_minio_admin} ${S3_SECRET_ACCESS_KEY:-kibitz_minio_dev_secret};
      mc mb --ignore-existing local/${S3_BUCKET:-kibitz-pgna};
      exit 0;
      "

volumes:
  kibitz_pgdata:
  kibitz_minio:
